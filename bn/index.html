<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d0f">
    <title>FSS BN Generator</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/vendor/xlsx.full.min.js" defer></script>
    <script src="js/vendor/jszip.min.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="type-view" class="type-view" aria-labelledby="type-title">
      <header class="type-header">
        <p class="eyebrow">FSS Generator</p>
        <h1 id="type-title">選擇 BN 樣式</h1>
        <p class="type-intro">選擇本次工作使用的樣式，進入共用 BN 控制台。</p>
      </header>

      <div class="type-grid" aria-label="BN 樣式">
        <button class="type-card" type="button" data-type="A">
          <img class="type-image" src="../assets/A.jpg" alt="">
          <span>樣式 A</span>
        </button>
        <button class="type-card" type="button" data-type="B">
          <img class="type-image" src="../assets/B.jpg" alt="">
          <span>樣式 B</span>
        </button>
        <button class="type-card" type="button" data-type="C">
          <img class="type-image" src="../assets/C.jpg" alt="">
          <span>樣式 C</span>
        </button>
        <button class="type-card" type="button" data-type="D">
          <img class="type-image" src="../assets/D.jpg" alt="">
          <span>樣式 D</span>
        </button>
      </div>
    </main>

    <main id="console-view" class="console-view" hidden>
      <aside class="bn-column" aria-labelledby="bn-list-title">
        <header class="column-header">
          <p class="eyebrow">FSS BN</p>
          <h1 id="bn-list-title">BN 版位</h1>
          <p id="current-type" class="current-type"></p>
        </header>
        <nav id="bn-list" class="bn-list" aria-label="17 個 BN 版位"></nav>
      </aside>

      <section class="preview-column" aria-labelledby="preview-title">
        <header class="preview-header">
          <div>
            <p class="eyebrow">目前預覽</p>
            <h2 id="preview-title">BN Preview</h2>
          </div>
        </header>
        <div id="preview" class="preview" aria-live="polite"></div>
      </section>

      <aside class="control-column" aria-label="BN 控制中心">
        <section class="control-card">
          <h2>匯入資料</h2>
          <button id="import-excel-button" class="action-button" type="button">匯入工單 Excel</button>
          <button id="import-json-button" class="action-button secondary" type="button">匯入暫存檔</button>
          <input id="excel-input" type="file" accept=".xlsx" hidden>
          <input id="json-input" type="file" accept="application/json,.json" hidden>
          <p id="import-status" class="io-status" role="status" aria-live="polite" hidden></p>
        </section>

        <section class="control-card editor-card" aria-labelledby="editor-title">
          <p class="section-kicker">目前選取</p>
          <h2 id="editor-title"></h2>
          <div id="editor" class="editor"></div>
          <button id="threshold-edit-button" class="action-button secondary" type="button" hidden>編輯門檻表</button>
        </section>

        <section class="control-card actions-card">
          <button id="export-button" class="action-button primary" type="button" disabled>下載完整專案</button>
          <p id="export-status" class="io-status" role="status" aria-live="polite" hidden></p>
          <button id="reset-button" class="action-button danger" type="button">重設工作區域</button>
        </section>
      </aside>

      <div id="threshold-modal" class="threshold-modal" hidden>
        <div class="threshold-panel" role="dialog" aria-modal="true" aria-labelledby="threshold-modal-title">
          <header class="threshold-header">
            <div>
              <h2 id="threshold-modal-title">編輯門檻表</h2>
              <p class="threshold-counts">
                <span id="threshold-logistics-count">適用物流 0 / 5</span>
                <span id="threshold-pairs-count">門檻項目 0 / 9</span>
              </p>
            </div>
            <div class="threshold-actions">
              <button id="threshold-add-logistics" class="action-button secondary" type="button">＋新增物流</button>
              <button id="threshold-add-pair" class="action-button secondary" type="button">＋新增門檻</button>
              <button id="threshold-close" class="action-button" type="button">關閉</button>
            </div>
          </header>
          <div id="threshold-table" class="threshold-table"></div>
        </div>
      </div>
    </main>
  </body>
</html>
