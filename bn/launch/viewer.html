        font-style: normal;
        font-weight: 400;
      }

        font-style: normal;
        font-weight: 500;
      }

        font-display: block;
        font-style: normal;
        font-weight: 700;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        color: #17211f;
        background: #f3f5f4;
        font-family: system-ui, sans-serif;
      }

      main {
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }

      .controls {
        width: 320px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 22px;
      }

      label {
        display: block;
        margin: 0 0 16px;
        font-weight: 600;
      }

      input[type="text"] {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 9px 10px;
        border: 1px solid #aeb8b5;
        border-radius: 4px;
        background: #ffffff;
        font: 16px system-ui, sans-serif;
      }

      .overlay-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .overlay-control input {
        margin: 0;
      }

      select#preset-select {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 9px 10px;
        border: 1px solid #aeb8b5;
        border-radius: 4px;
        background: #ffffff;
        font: 16px system-ui, sans-serif;
      }

      textarea#model-input {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 9px 10px;
        border: 1px solid #aeb8b5;
        border-radius: 4px;
        background: #ffffff;
        font: 13px ui-monospace, monospace;
        resize: vertical;
      }

      #warnings-area h2 {
        margin: 0 0 8px;
        font-size: 15px;
        color: #b42318;
      }

      #warnings-area ul {
        margin: 0;
        padding-left: 18px;
        font-size: 13px;
        color: #b42318;
      }

      .preview {
        position: relative;
        flex: 0 0 auto;
      }

      canvas,
      .alignment-overlay {
        position: absolute;
        inset: 0;
        display: block;
      }

      .alignment-overlay {
        pointer-events: none;
      }

      [hidden] {
        display: none !important;
      }

      .load-error {
        color: #b42318;
        font-weight: 600;
      }
    </style>
  </head>

        </label>

        <label for="extra-input" hidden>
          額外欄位

        </label>

        <label class="overlay-control" for="overlay-toggle">
          <input id="overlay-toggle" type="checkbox" disabled />

        </label>

        <label id="preset-select-label" for="preset-select" hidden>
          測試資料組
          <select id="preset-select" disabled></select>
        </label>

        <label id="model-input-label" for="model-input" hidden>
          JSON 測試資料
          <textarea id="model-input" rows="16" spellcheck="false" disabled></textarea>
        </label>

        <p id="model-error" class="load-error" role="alert" hidden></p>

        <section id="warnings-area" aria-label="A－17 renderer 警告" hidden>
          <h2>Renderer 警告</h2>
          <ul id="warnings-list"></ul>
        </section>

        <p id="load-error" class="load-error" role="alert" hidden></p>

        <img

          class="alignment-overlay"

          "目前 BN Viewer 只支援樣式 A／01_DDcard BN、02_MALL HBN、03_Coin page BN、04_Loyalty BN、05_MSBN、06_IG、07_FB POST、08_SPX TVBN_1、09_SPX TVBN_2、10_POP UP、11_Line OA、12_LPBN、13_Skinny BN_APP、14_Skinny BN_PC、15_AR、16_副區、17_門檻表 與樣式 D／01_DDcard BN、02_MALL HBN、03_Coin page BN、06_IG、07_FB POST、08_SPX TVBN_1、09_SPX TVBN_2、10_POP UP。",
        );
      }

      if (
        typeof renderTemplate !== "function" ||
        typeof waitForFonts !== "function"
      ) {
        throw new Error(`${viewerLabel} Template module 不完整。`);
      }

      document.title = `${viewerTitle} 校稿`;
      document.querySelector("#viewer-heading").textContent = viewerTitle;
      document
        .querySelector("#controls")
        .setAttribute("aria-label", `${viewerLabel} 測試文字`);

      const preview = document.querySelector("#preview");
      preview.setAttribute("aria-label", `${viewerLabel} 正式 Canvas 預覽`);

      const canvas = document.querySelector("#preview-canvas");
      const overlay = document.querySelector("#alignment-overlay");

      if (!thresholdTable) {
        preview.style.width = `${width}px`;
        preview.style.height = `${height}px`;

        canvas.width = width;
        canvas.height = height;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        overlay.src = new URL(overlaySource, import.meta.url).href;
        overlay.width = width;
        overlay.height = height;
        overlay.style.width = `${width}px`;
        overlay.style.height = `${height}px`;
      }

      const fieldSlots = [
        {
          label: document.querySelector('label[for="headline-input"]'),
          input: document.querySelector("#headline-input"),
        },
        {
          label: document.querySelector('label[for="subheadline-input"]'),
          input: document.querySelector("#subheadline-input"),
        },
        {
          label: document.querySelector('label[for="protection-input"]'),
          input: document.querySelector("#protection-input"),
        },
        {
          label: document.querySelector('label[for="extra-input"]'),
          input: document.querySelector("#extra-input"),
        },
      ];

      let fields;
      if (thresholdTable) {
        fields = [];
        for (const slot of fieldSlots) {
          slot.label.hidden = true;
          slot.input.disabled = true;
        }
      } else if (fieldConfig) {
        fields = fieldConfig.map((config, index) => {
          const slot = fieldSlots[index];
          slot.label.hidden = false;
          slot.label.firstChild.textContent = config.label;
          slot.input.value = config.value;
          return { id: config.id, input: slot.input, limit: config.limit };
        });
        for (const slot of fieldSlots.slice(fieldConfig.length)) {
          slot.label.hidden = true;
          slot.input.disabled = true;
        }
      } else {
        fields = [
          { id: "headline", input: fieldSlots[0].input, limit: 8 },
          { id: "subheadline", input: fieldSlots[1].input, limit: 7 },
          { id: "protectionText", input: fieldSlots[2].input, limit: 17 },
        ];
      }
      const overlayToggle = document.querySelector("#overlay-toggle");
      const loadError = document.querySelector("#load-error");

      if (thresholdTable) {
        document.querySelector('label[for="overlay-toggle"]').hidden = true;
        overlayToggle.disabled = true;
        overlay.hidden = true;
      }
      const state = Object.fromEntries(fields.map((field) => [field.id, field.input.value]));
      let backgroundImage = null;

      function countTextUnits(value) {
        let units = 0;
        for (const character of String(value || "")) {
          units += character.codePointAt(0) <= 0x7f ? 0.5 : 1;
        }
        return units;
      }

      function loadImage(source, label) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.addEventListener("load", () => resolve(image), { once: true });
          image.addEventListener(
            "error",
            () => reject(new Error(`${label}載入失敗。`)),
            { once: true },
          );
          image.src = source;
        });
      }

      // logoSource 只有 D－01 branch 會設定；A－01～16 恆為 null，
      // 因此 A 收到的第二參數仍是原本完全相同的 backgroundImage 物件。
      function render() {
        renderTemplate(
          canvas,
          logoSource ? { backgroundImage, logoImage } : backgroundImage,
          state,
        );
      }

      function bindField(field) {
        let isComposing = false;
        let lastValidValue = field.input.value;
        let skipTrailingInputValue = null;

        const commit = () => {
          if (countTextUnits(field.input.value) > field.limit) {
            field.input.value = lastValidValue;
            return;
          }

          lastValidValue = field.input.value;
          state[field.id] = field.input.value;
          render();
        };

        field.input.addEventListener("compositionstart", () => {
          isComposing = true;
          skipTrailingInputValue = null;
        });

        field.input.addEventListener("compositionend", () => {
          isComposing = false;
          commit();
          skipTrailingInputValue = field.input.value;
        });

        field.input.addEventListener("input", (event) => {
          if (isComposing || event.isComposing) return;
          if (
            skipTrailingInputValue !== null &&
            field.input.value === skipTrailingInputValue
          ) {
            skipTrailingInputValue = null;
            return;
          }
          skipTrailingInputValue = null;
          commit();
        });
      }

      overlayToggle.addEventListener("change", () => {
        overlay.hidden = !overlayToggle.checked;
      });

      // A－17 專用：presets ＋ JSON textarea ＋ warnings 的開發／校稿控制。
      // 只作 Launch 視覺校稿，不是正式 Editor、Excel Import、Workspace 或 Export。

          "P7｜錯誤資料（warnings 仍整張生成）": {

            ],
            thresholds: [
              {
                name: "平日門檻",
                cells: [

                ],
              },

                name: "",

                  { color: "綠", amount: "$100" },
                  { color: "紅", amount: "" },
                ],
              },
              {
                name: "6/1加碼",
                cells: [
                  { color: "", amount: "$77" },
                  { color: "", amount: "↑" },
                ],
              },
            ],
            vip: {
              title: "天天無限免運 ｜ 不分時段$49起",
              copy: "額外享天天9折優惠券，首月免費試用",
              cta: "訂閱去",
            },
          },
        };

        const presetLabel = document.querySelector("#preset-select-label");
        const presetSelect = document.querySelector("#preset-select");
        const modelLabel = document.querySelector("#model-input-label");
        const modelInput = document.querySelector("#model-input");
        const modelError = document.querySelector("#model-error");
        const warningsArea = document.querySelector("#warnings-area");
        const warningsList = document.querySelector("#warnings-list");

        let titleImage = null;
        let vipImage = null;

        const syncCanvasSize = () => {
          preview.style.width = `${canvas.width}px`;
          preview.style.height = `${canvas.height}px`;
          canvas.style.width = `${canvas.width}px`;
          canvas.style.height = `${canvas.height}px`;
        };

        const showWarnings = (result) => {
          const entries = [...result.warnings];
          const addFit = (label, fit) => {
            if (fit && (!fit.fitsWidth || !fit.fitsHeight)) {
              entries.push(
                `${label} ink 超出可用範圍（fitsWidth=${fit.fitsWidth}、fitsHeight=${fit.fitsHeight}）。`,
              );
            }
          };
          addFit("主標題", result.frames.mainTitle);
          addFit("適用物流", result.frames.logisticsHeader);
          result.frames.logistics.forEach((fit, index) =>
            addFit(`物流欄 ${index + 1} 名稱`, fit),
          );
          result.frames.thresholds.forEach((fit, index) =>
            addFit(`門檻列 ${index + 1} 名稱`, fit),
          );
          result.frames.amounts.forEach((cells, index) =>
            cells.forEach((fit) => addFit(`物流欄 ${index + 1} 金額`, fit)),
          );
          addFit("VIP 標題", result.frames.vipTitle);
          addFit("VIP 文案", result.frames.vipCopy);
          addFit("CTA", result.frames.cta);

          warningsList.replaceChildren(
            ...entries.map((text) => {
              const item = document.createElement("li");
              item.textContent = text;
              return item;
            }),
          );
          warningsArea.hidden = entries.length === 0;
        };

        const renderModel = () => {
          let model;
          try {
            model = JSON.parse(modelInput.value);
          } catch (error) {
            modelError.textContent = `JSON 解析失敗：${error.message}`;
            modelError.hidden = false;
            return;
          }

          try {
            const result = renderTemplate(canvas, { titleImage, vipImage }, model);
            syncCanvasSize();
            modelError.hidden = true;
            modelError.textContent = "";
            showWarnings(result);
          } catch (error) {
            modelError.textContent =
              error instanceof Error ? error.message : String(error);
            modelError.hidden = false;
          }
        };

        const applyPreset = (name) => {
          modelInput.value = JSON.stringify(presets[name], null, 2);
          renderModel();
        };

        for (const name of Object.keys(presets)) {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          presetSelect.append(option);
        }
        presetSelect.addEventListener("change", () => applyPreset(presetSelect.value));

        let isComposing = false;
        modelInput.addEventListener("compositionstart", () => {
          isComposing = true;
        });
        modelInput.addEventListener("compositionend", () => {
          isComposing = false;
          renderModel();
        });
        modelInput.addEventListener("input", (event) => {
          if (isComposing || event.isComposing) return;
          renderModel();
        });

        try {
          [titleImage, vipImage] = await Promise.all([
            loadImage(
              new URL(thresholdTable.titleSource, import.meta.url).href,

            ),
            loadImage(
              new URL(thresholdTable.vipSource, import.meta.url).href,
              "A－17 正式 VIP 底圖",

            waitForFonts(),

          presetLabel.hidden = false;
          modelLabel.hidden = false;
          presetSelect.disabled = false;
          modelInput.disabled = false;
          applyPreset(Object.keys(presets)[0]);
        } catch (error) {
          loadError.textContent =
            error instanceof Error ? error.message : String(error);
          loadError.hidden = false;
          throw error;
        }
      }

      if (thresholdTable) {
        await initThresholdTableViewer();
      } else {
        try {
          const backgroundUrl = new URL(
            backgroundSource,
            import.meta.url,
          );
          [backgroundImage] = await Promise.all([
            loadImage(backgroundUrl.href, `${viewerLabel} 正式底圖`),
            waitForFonts(),
            overlay.decode().then(() => {
              if (
                overlay.naturalWidth !== width ||
                overlay.naturalHeight !== height
              ) {
                throw new Error(
                  `${viewerLabel} 正式對位圖必須為 ${width} × ${height}px。`,
                );
              }
            }),
          ]);

          // 固定 Logo 只在 D－01（logoSource 有值）時額外載入；
          // A－01～16 恆為 null，不執行此區塊，載入流程與原本完全相同。
          if (logoSource) {
            logoImage = await loadImage(
              new URL(logoSource, import.meta.url).href,
              `${viewerLabel} 正式 Logo`,
            );
            if (!logoImage.complete || logoImage.naturalWidth === 0) {
              throw new Error(`${viewerLabel} 正式 Logo 尚未完成解碼。`);
            }
          }

          render();
          fields.forEach((field) => {
            bindField(field);
            field.input.disabled = false;
          });
          overlayToggle.disabled = false;
        } catch (error) {
          loadError.textContent = error instanceof Error ? error.message : String(error);
          loadError.hidden = false;
          throw error;
        }
      }
    </script>
