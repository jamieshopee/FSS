<!doctype html>
<html lang="zh-Hant" data-fss-bn-viewer="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>樣式 A－01_DDcard BN 校稿</title>
    <style>
      @font-face {
        font-family: "ShopeeNotoSans Medium";
        src: url("../../fonts/ShopeeNotoSans(content)-Medium.woff2") format("woff2");
        font-display: block;
        font-style: normal;
        font-weight: 500;
      }

      @font-face {
        font-family: "ShopeeNotoSans Bold";
        src: url("../../fonts/ShopeeNotoSans(content)-Bold.woff2") format("woff2");
        font-display: block;
        font-style: normal;
        font-weight: 700;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        color: #17211f;
        background: #f3f5f4;
        font-family: system-ui, sans-serif;
      }

      main {
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }

      .controls {
        width: 320px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 22px;
      }

      label {
        display: block;
        margin: 0 0 16px;
        font-weight: 600;
      }

      input[type="text"] {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 9px 10px;
        border: 1px solid #aeb8b5;
        border-radius: 4px;
        background: #ffffff;
        font: 16px system-ui, sans-serif;
      }

      .overlay-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .overlay-control input {
        margin: 0;
      }

      .preview {
        position: relative;
        flex: 0 0 auto;
      }

      canvas,
      .alignment-overlay {
        position: absolute;
        inset: 0;
        display: block;
      }

      .alignment-overlay {
        pointer-events: none;
      }

      [hidden] {
        display: none !important;
      }

      .load-error {
        color: #b42318;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="controls" class="controls" aria-label="A－01 測試文字">
        <h1 id="viewer-heading">樣式 A－01_DDcard BN</h1>

        <label for="headline-input">
          主標
          <input id="headline-input" type="text" autocomplete="off" value="商城優選無限免運" disabled />
        </label>

        <label for="subheadline-input">
          副標
          <input id="subheadline-input" type="text" autocomplete="off" value="宅配免運$490起" disabled />
        </label>

        <label for="protection-input">
          保護文字
          <input id="protection-input" type="text" autocomplete="off" value="免運優惠須依店家適用之物流為主" disabled />
        </label>

        <label class="overlay-control" for="overlay-toggle">
          <input id="overlay-toggle" type="checkbox" disabled />
          顯示對位圖
        </label>

        <p id="load-error" class="load-error" role="alert" hidden></p>
      </section>

      <div id="preview" class="preview" aria-label="A－01 正式 Canvas 預覽">
        <canvas id="preview-canvas" width="531" height="792"></canvas>
        <img
          id="alignment-overlay"
          class="alignment-overlay"
          alt=""
          hidden
        />
      </div>
    </main>

    <script type="module">
      const parameters = new URLSearchParams(window.location.search);
      let viewerTitle;
      let viewerLabel;
      let width;
      let height;
      let backgroundSource;
      let overlaySource;
      let renderTemplate;
      let waitForFonts;

      if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "01_DDcard BN"
      ) {
        const template = await import("../templates/A/01-ddcard-bn.js");
        viewerTitle = "樣式 A－01_DDcard BN";
        viewerLabel = "A－01";
        width = 531;
        height = 792;
        backgroundSource = "../assets/A/底圖/01_DDcard BN.jpg";
        overlaySource = "../assets/A/對位/01_DDcard BN.png";
        renderTemplate = template.renderDdcardBn;
        waitForFonts = template.waitForDdcardBnFonts;
      } else if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "02_MALL HBN"
      ) {
        const template = await import("../templates/A/02-mall-hbn.js");
        viewerTitle = "樣式 A－02_MALL HBN";
        viewerLabel = "A－02";
        width = 1200;
        height = 360;
        backgroundSource = "../assets/A/底圖/02_MALL HBN.jpg";
        overlaySource = "../assets/A/對位/02_MALL HBN.png";
        renderTemplate = template.renderMallHbn;
        waitForFonts = template.waitForMallHbnFonts;
      } else if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "03_Coin page BN"
      ) {
        const template = await import("../templates/A/03-coin-page-bn.js");
        viewerTitle = "樣式 A－03_Coin page BN";
        viewerLabel = "A－03";
        width = 1200;
        height = 391;
        backgroundSource = "../assets/A/底圖/03_Coin page BN.jpg";
        overlaySource = "../assets/A/對位/03_Coin page BN.png";
        renderTemplate = template.renderCoinPageBn;
        waitForFonts = template.waitForCoinPageBnFonts;
      } else if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "04_Loyalty BN"
      ) {
        const template = await import("../templates/A/04-loyalty-bn.js");
        viewerTitle = "樣式 A－04_Loyalty BN";
        viewerLabel = "A－04";
        width = 702;
        height = 208;
        backgroundSource = "../assets/A/底圖/04_Loyalty BN.png";
        overlaySource = "../assets/A/對位/04_Loyalty BN.png";
        renderTemplate = template.renderLoyaltyBn;
        waitForFonts = template.waitForLoyaltyBnFonts;
      } else if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "05_MSBN"
      ) {
        const template = await import("../templates/A/05-msbn.js");
        viewerTitle = "樣式 A－05_MSBN";
        viewerLabel = "A－05";
        width = 1200;
        height = 400;
        backgroundSource = "../assets/A/底圖/05_MSBN.png";
        overlaySource = "../assets/A/對位/05_MSBN.png";
        renderTemplate = template.renderMsbn;
        waitForFonts = template.waitForMsbnFonts;
      } else if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "06_IG"
      ) {
        const template = await import("../templates/A/06-ig.js");
        viewerTitle = "樣式 A－06_IG";
        viewerLabel = "A－06";
        width = 900;
        height = 1600;
        backgroundSource = "../assets/A/底圖/06_IG.jpg";
        overlaySource = "../assets/A/對位/06_IG.png";
        renderTemplate = template.renderIg;
        waitForFonts = template.waitForIgFonts;
      } else if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "07_FB POST"
      ) {
        const template = await import("../templates/A/07-fb-post.js");
        viewerTitle = "樣式 A－07_FB POST";
        viewerLabel = "A－07";
        width = 1200;
        height = 630;
        backgroundSource = "../assets/A/底圖/07_FB POST.jpg";
        overlaySource = "../assets/A/對位/07_FB POST.png";
        renderTemplate = template.renderFbPost;
        waitForFonts = template.waitForFbPostFonts;
      } else if (
        parameters.get("type") === "A" &&
        parameters.get("bn") === "08_SPX TVBN_1"
      ) {
        const template = await import("../templates/A/08-spx-tvbn-1.js");
        viewerTitle = "樣式 A－08_SPX TVBN_1";
        viewerLabel = "A－08";
        width = 1080;
        height = 1920;
        backgroundSource = "../assets/A/底圖/08_SPX TVBN_1.jpg";
        overlaySource = "../assets/A/對位/08_SPX TVBN_1.png";
        renderTemplate = template.renderSpxTvbn1;
        waitForFonts = template.waitForSpxTvbn1Fonts;
      } else {
        throw new Error(
          "目前 BN Viewer 只支援樣式 A／01_DDcard BN、02_MALL HBN、03_Coin page BN、04_Loyalty BN、05_MSBN、06_IG、07_FB POST 與 08_SPX TVBN_1。",
        );
      }

      if (
        typeof renderTemplate !== "function" ||
        typeof waitForFonts !== "function"
      ) {
        throw new Error(`${viewerLabel} Template module 不完整。`);
      }

      document.title = `${viewerTitle} 校稿`;
      document.querySelector("#viewer-heading").textContent = viewerTitle;
      document
        .querySelector("#controls")
        .setAttribute("aria-label", `${viewerLabel} 測試文字`);

      const preview = document.querySelector("#preview");
      preview.style.width = `${width}px`;
      preview.style.height = `${height}px`;
      preview.setAttribute("aria-label", `${viewerLabel} 正式 Canvas 預覽`);

      const canvas = document.querySelector("#preview-canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      const overlay = document.querySelector("#alignment-overlay");
      overlay.src = new URL(overlaySource, import.meta.url).href;
      overlay.width = width;
      overlay.height = height;
      overlay.style.width = `${width}px`;
      overlay.style.height = `${height}px`;

      const fields = [
        { id: "headline", input: document.querySelector("#headline-input"), limit: 8 },
        { id: "subheadline", input: document.querySelector("#subheadline-input"), limit: 7 },
        { id: "protectionText", input: document.querySelector("#protection-input"), limit: 17 },
      ];
      const overlayToggle = document.querySelector("#overlay-toggle");
      const loadError = document.querySelector("#load-error");
      const state = Object.fromEntries(fields.map((field) => [field.id, field.input.value]));
      let backgroundImage = null;

      function countTextUnits(value) {
        let units = 0;
        for (const character of String(value || "")) {
          units += character.codePointAt(0) <= 0x7f ? 0.5 : 1;
        }
        return units;
      }

      function loadImage(source, label) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.addEventListener("load", () => resolve(image), { once: true });
          image.addEventListener(
            "error",
            () => reject(new Error(`${label}載入失敗。`)),
            { once: true },
          );
          image.src = source;
        });
      }

      function render() {
        renderTemplate(canvas, backgroundImage, state);
      }

      function bindField(field) {
        let isComposing = false;
        let lastValidValue = field.input.value;
        let skipTrailingInputValue = null;

        const commit = () => {
          if (countTextUnits(field.input.value) > field.limit) {
            field.input.value = lastValidValue;
            return;
          }

          lastValidValue = field.input.value;
          state[field.id] = field.input.value;
          render();
        };

        field.input.addEventListener("compositionstart", () => {
          isComposing = true;
          skipTrailingInputValue = null;
        });

        field.input.addEventListener("compositionend", () => {
          isComposing = false;
          commit();
          skipTrailingInputValue = field.input.value;
        });

        field.input.addEventListener("input", (event) => {
          if (isComposing || event.isComposing) return;
          if (
            skipTrailingInputValue !== null &&
            field.input.value === skipTrailingInputValue
          ) {
            skipTrailingInputValue = null;
            return;
          }
          skipTrailingInputValue = null;
          commit();
        });
      }

      overlayToggle.addEventListener("change", () => {
        overlay.hidden = !overlayToggle.checked;
      });

      try {
        const backgroundUrl = new URL(
          backgroundSource,
          import.meta.url,
        );
        [backgroundImage] = await Promise.all([
          loadImage(backgroundUrl.href, `${viewerLabel} 正式底圖`),
          waitForFonts(),
          overlay.decode().then(() => {
            if (
              overlay.naturalWidth !== width ||
              overlay.naturalHeight !== height
            ) {
              throw new Error(
                `${viewerLabel} 正式對位圖必須為 ${width} × ${height}px。`,
              );
            }
          }),
        ]);

        render();
        fields.forEach((field) => {
          bindField(field);
          field.input.disabled = false;
        });
        overlayToggle.disabled = false;
      } catch (error) {
        loadError.textContent = error instanceof Error ? error.message : String(error);
        loadError.hidden = false;
        throw error;
      }
    </script>
  </body>
</html>
